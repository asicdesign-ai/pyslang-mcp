name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      markdown_changed: ${{ steps.detect.outputs.markdown_changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed file types
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 "$head")"
            fi
          fi

          mapfile -t changed_files < <(git diff --name-only "$base" "$head" | sed '/^$/d')
          docs_only=false
          markdown_changed=false

          if (( ${#changed_files[@]} > 0 )); then
            docs_only=true
            for file in "${changed_files[@]}"; do
              case "${file,,}" in
                *.md|*.markdown)
                  markdown_changed=true
                  ;;
              esac

              case "${file,,}" in
                readme.md|changelog.md|contributing.md|*_plan.md|docs/*)
                  ;;
                *)
                  docs_only=false
                  ;;
              esac
            done
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "markdown_changed=$markdown_changed" >> "$GITHUB_OUTPUT"
          printf 'Changed files:\n'
          printf '  %s\n' "${changed_files[@]}"
          echo "docs_only=$docs_only"
          echo "markdown_changed=$markdown_changed"

  markdown-language:
    needs: changes
    if: needs.changes.outputs.markdown_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install spelling checker
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'codespell>=2,<3'

      - name: Check changed Markdown spelling
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 "$head")"
            fi
          fi

          mapfile -t markdown_files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$head" -- '*.md' '*.markdown' |
              sed '/^$/d' |
              sort -u
          )

          if (( ${#markdown_files[@]} == 0 )); then
            echo "No changed Markdown files to check."
            exit 0
          fi

          printf 'Checking Markdown files:\n'
          printf '  %s\n' "${markdown_files[@]}"
          codespell "${markdown_files[@]}" \
            --ignore-words-list "pyslang,systemverilog,verilog,filelist,filelists,maas,stdio,svh,hdl,rtl,pypi,uvx,mcp,codex"

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-14
            python-version: "3.12"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Check formatting
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: pyright

      - name: Run tests
        run: pytest --cov=src/pyslang_mcp --cov-report=xml --cov-report=term-missing:skip-covered -q

  security-regression:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run security regression tests
        run: pytest -q -m security

  hdl-smoke:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run HDL smoke validation
        run: pytest -q tests/test_hdl_smoke.py

  mcp-protocol-smoke:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run MCP stdio protocol smoke
        run: pytest -q tests/test_mcp_stdio.py

  skill-eval-smoke:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate pyslang-verilog-context eval fixtures
        run: python skills/pyslang-verilog-context/scripts/validate_eval_fixtures.py

      - name: Run deterministic skill eval smoke subset
        run: |
          python skills/pyslang-verilog-context/scripts/run_comparison_evals.py \
            --output-dir /tmp/pyslang-verilog-context-eval-smoke \
            --case single-file-design-summary \
            --case filelist-hierarchy-sync-fifo \
            --case compile-diagnostic-triage

  package-smoke:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist

      - name: Install wheel in fresh virtual environment
        run: |
          python -m venv /tmp/pyslang-mcp-wheel-smoke
          /tmp/pyslang-mcp-wheel-smoke/bin/pip install --upgrade pip
          /tmp/pyslang-mcp-wheel-smoke/bin/pip install --no-cache-dir dist/*.whl

      - name: Check installed console script help
        run: /tmp/pyslang-mcp-wheel-smoke/bin/pyslang-mcp --help

      - name: Run installed MCP stdio smoke
        run: |
          /tmp/pyslang-mcp-wheel-smoke/bin/python scripts/package_smoke_stdio.py \
            /tmp/pyslang-mcp-wheel-smoke/bin/pyslang-mcp \
            --project-root "$PWD/tests/fixtures/multi_file"

  internal-maas-docker-smoke:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Docker tools
        run: |
          docker --version
          docker compose version

      - name: Validate internal MaaS compose config
        env:
          PYSLANG_MCP_WORKSPACE: ${{ github.workspace }}/tests/fixtures/multi_file
          PYSLANG_MCP_HTTP_PORT: "18000"
          PYSLANG_MCP_HTTP_BEARER_TOKEN: ci-token
        run: docker compose -f deploy/internal/docker-compose.yml config

      - name: Build and start internal MaaS container
        env:
          PYSLANG_MCP_WORKSPACE: ${{ github.workspace }}/tests/fixtures/multi_file
          PYSLANG_MCP_HTTP_PORT: "18000"
          PYSLANG_MCP_HTTP_BEARER_TOKEN: ci-token
        run: |
          docker compose -f deploy/internal/docker-compose.yml up -d --build

      - name: Check internal MaaS health endpoint
        env:
          PYSLANG_MCP_WORKSPACE: ${{ github.workspace }}/tests/fixtures/multi_file
          PYSLANG_MCP_HTTP_PORT: "18000"
          PYSLANG_MCP_HTTP_BEARER_TOKEN: ci-token
        run: |
          for _ in {1..60}; do
            if python -c 'import json, urllib.request; body = json.loads(urllib.request.urlopen("http://127.0.0.1:18000/healthz", timeout=2).read()); assert body == {"status": "ok", "server": "pyslang-mcp"}, body'; then
              exit 0
            fi
            sleep 2
          done

          docker compose -f deploy/internal/docker-compose.yml ps
          docker compose -f deploy/internal/docker-compose.yml logs
          exit 1

      - name: Stop internal MaaS container
        if: always()
        env:
          PYSLANG_MCP_WORKSPACE: ${{ github.workspace }}/tests/fixtures/multi_file
          PYSLANG_MCP_HTTP_PORT: "18000"
          PYSLANG_MCP_HTTP_BEARER_TOKEN: ci-token
        run: docker compose -f deploy/internal/docker-compose.yml down --volumes
